<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Olivetta Restaurant - Calendario de Eventos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FullCalendar CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <style>
        /* Personalización de FullCalendar para el tema Verde Aceituna */
        .fc {
            --fc-border-color: rgba(255, 255, 255, 0.2);
            --fc-button-bg-color: #556B2F;
            --fc-button-border-color: #3B4A20;
            --fc-button-hover-bg-color: #3B4A20;
            --fc-button-active-bg-color: #2D3818;
            --fc-today-bg-color: rgba(85, 107, 47, 0.15);
        }
        .fc .fc-toolbar-title {
            color: #1c2810;
            font-weight: 700;
        }
        .fc-theme-standard td, .fc-theme-standard th {
            border-color: rgba(0, 0, 0, 0.1) !important;
        }
        .fc-timegrid-slot {
            height: 2.5em !important;
        }
    </style>
</head>
<body class="bg-[#8A9A5B] text-stone-900 min-h-screen p-3 md:p-6 font-sans select-none">

    <!-- Encabezado con Logo Olivetta y Estado de Conexión -->
    <header class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 py-4 mb-4 bg-[#708238]/40 p-4 px-6 rounded-2xl border-2 border-white/60 shadow-lg backdrop-blur-md">
        <div class="flex items-center gap-4">
            <!-- Isotipo 'O' con borde blanco -->
            <div class="w-14 h-14 rounded-full border-2 border-white shadow-md overflow-hidden bg-[#556B2F] flex items-center justify-center shrink-0">
                <img src="logo.olivetta.jpg" alt="Olivetta Logo" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/100x100/556B2F/ffffff?text=O';">
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-serif font-bold tracking-wider text-stone-950 uppercase drop-shadow-sm">Olivetta Ristorante</h1>
                <p class="text-xs font-semibold text-stone-800 tracking-widest uppercase">Lechería, Anzoátegui</p>
            </div>
        </div>

        <!-- Indicador de Estado y Configuración -->
        <div class="flex items-center gap-3">
            <div id="statusBadge" class="bg-amber-100 text-amber-900 border border-amber-300 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-2 shadow-sm">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                <span>Modo Demo</span>
            </div>
            <button onclick="abrirModalConfig()" class="bg-white/80 hover:bg-white text-[#3B4A20] font-bold px-3 py-1.5 rounded-xl border border-stone-300 shadow-sm text-xs flex items-center gap-1.5 transition-all">
                ⚙️ Configurar Supabase
            </button>
        </div>
    </header>

    <!-- Contenedor del Calendario Táctil -->
    <main class="max-w-6xl mx-auto">
        <section class="bg-[#f4f6ef] p-4 md:p-6 rounded-2xl border-2 border-white shadow-2xl">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                <h2 class="text-lg md:text-xl font-bold text-[#3B4A20] flex items-center gap-2">
                    📅 Calendario de Reservas y Eventos
                </h2>
                <button onclick="abrirModalNuevaReserva()" class="bg-[#556B2F] hover:bg-[#3B4A20] text-white font-bold px-4 py-2.5 rounded-xl shadow-md transition-transform active:scale-95 text-sm flex items-center gap-2 w-full sm:w-auto justify-center">
                    ➕ Agendar Evento
                </button>
            </div>

            <!-- Calendario FullCalendar (7 AM a 11 PM) -->
            <div id="calendar" class="touch-manipulation rounded-xl overflow-hidden bg-white/70 p-2 shadow-inner"></div>
        </section>
    </main>

    <!-- Panel Flotante / Modal de Registro y Edición de Eventos -->
    <div id="modalReserva" class="hidden fixed inset-0 bg-stone-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#f9fbf7] border-2 border-[#556B2F] w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden transform transition-all max-h-[90vh] flex flex-col">
            
            <!-- Encabezado Modal -->
            <div class="bg-[#556B2F] text-white p-4 px-6 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full border border-white overflow-hidden bg-white shrink-0">
                        <img src="logo.olivetta.jpg" alt="Logo" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/50x50/556B2F/ffffff?text=O';">
                    </div>
                    <h3 id="modalTitulo" class="font-serif font-bold text-lg">Registrar Evento - Olivetta</h3>
                </div>
                <button onclick="cerrarModal()" class="text-white/80 hover:text-white font-bold text-2xl leading-none">&times;</button>
            </div>

            <!-- Formulario de Registro / Edición -->
            <form id="reservaForm" class="p-6 space-y-4 overflow-y-auto">
                <!-- ID Oculto para identificar si es edición -->
                <input type="hidden" id="reserva_id" value="">
                
                <!-- Nombre del Cliente -->
                <div>
                    <label class="block text-xs font-bold uppercase text-[#3B4A20] mb-1">Nombre del Cliente</label>
                    <input type="text" id="nombre_cliente" required placeholder="Ej. Antonio Abinazar" class="w-full p-3 bg-white border border-stone-300 rounded-xl text-stone-900 focus:ring-2 focus:ring-[#556B2F] focus:outline-none">
                </div>

                <!-- Teléfono del Cliente -->
                <div>
                    <label class="block text-xs font-bold uppercase text-[#3B4A20] mb-1">Teléfono de Contacto</label>
                    <input type="tel" id="telefono_cliente" required placeholder="0414-XXXXXXX" class="w-full p-3 bg-white border border-stone-300 rounded-xl text-stone-900 focus:ring-2 focus:ring-[#556B2F] focus:outline-none">
                </div>

                <!-- Área del Evento y Cantidad de Personas -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-[#3B4A20] mb-1">Área del Evento</label>
                        <select id="area_evento" required class="w-full p-3 bg-white border border-stone-300 rounded-xl text-stone-900 font-medium focus:ring-2 focus:ring-[#556B2F] focus:outline-none">
                            <option value="restorante">🍽️ Restorante</option>
                            <option value="terraza">🌿 Terraza</option>
                            <option value="piscina">🏊 Piscina</option>
                            <option value="salon">🏛️ Salón</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-[#3B4A20] mb-1">Cant. Personas</label>
                        <input type="number" id="numero_personas" min="1" max="200" value="10" required class="w-full p-3 bg-white border border-stone-300 rounded-xl text-stone-900 text-center font-bold focus:ring-2 focus:ring-[#556B2F] focus:outline-none">
                    </div>
                </div>

                <!-- Tipo de Evento -->
                <div>
                    <label class="block text-xs font-bold uppercase text-[#3B4A20] mb-1">Tipo de Evento</label>
                    <select id="tipo_evento" required class="w-full p-3 bg-white border border-stone-300 rounded-xl text-stone-900 font-medium focus:ring-2 focus:ring-[#556B2F] focus:outline-none">
                        <option value="cumpleanos">🎉 Cumpleaños</option>
                        <option value="bautizo">🕊️ Bautizo</option>
                        <option value="reunion_corporativa">💼 Reunión Corporativa</option>
                        <option value="boda_civil">💍 Boda Civil</option>
                        <option value="graduacion">🎓 Graduación</option>
                        <option value="otro">🍷 Otro Evento</option>
                    </select>
                </div>

                <!-- Fecha y Hora (Horario limitado 7:00 AM - 11:00 PM) -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-[#3B4A20] mb-1">Fecha</label>
                        <input type="date" id="fecha_reserva" required class="w-full p-3 bg-white border border-stone-300 rounded-xl text-stone-900 text-center font-bold focus:ring-2 focus:ring-[#556B2F] focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-[#3B4A20] mb-1">Hora (7 AM - 11 PM)</label>
                        <input type="time" id="hora_reserva" min="07:00" max="23:00" required class="w-full p-3 bg-white border border-stone-300 rounded-xl text-stone-900 text-center font-bold focus:ring-2 focus:ring-[#556B2F] focus:outline-none">
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="flex flex-wrap gap-2 pt-3">
                    <button type="submit" id="btnGuardarReserva" class="flex-1 py-3.5 bg-[#556B2F] hover:bg-[#3B4A20] text-white font-bold uppercase tracking-wider rounded-xl shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <span id="txtBtnGuardar">Confirmar Reserva</span>
                    </button>
                    
                    <!-- Botón Eliminar (Visible solo en Edición) -->
                    <button type="button" id="btnEliminarReserva" onclick="eliminarReservaActual()" class="hidden px-4 py-3.5 bg-red-700 hover:bg-red-800 text-white font-bold rounded-xl shadow-md transition-colors flex items-center gap-1.5">
                        🗑️ Eliminar
                    </button>

                    <button type="button" onclick="cerrarModal()" class="px-5 py-3.5 bg-stone-200 hover:bg-stone-300 text-stone-700 font-bold rounded-xl transition-colors">
                        Cancelar
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Modal Configuración Supabase -->
    <div id="modalConfig" class="hidden fixed inset-0 bg-stone-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#f9fbf7] border-2 border-[#556B2F] w-full max-w-md rounded-2xl shadow-2xl overflow-hidden p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3 border-stone-200">
                <h3 class="font-bold text-[#3B4A20] text-lg flex items-center gap-2">
                    ⚙️ Configurar Conexión Supabase
                </h3>
                <button onclick="cerrarModalConfig()" class="text-stone-500 hover:text-stone-800 font-bold text-xl">&times;</button>
            </div>
            
            <p class="text-xs text-stone-600">
                Pega la URL y Key de tu proyecto en Supabase para vincular el guardar y consultar eventos en tiempo real:
            </p>

            <div>
                <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Project URL</label>
                <input type="url" id="cfg_supabase_url" placeholder="https://xyzcompany.supabase.co" class="w-full p-2.5 bg-white border border-stone-300 rounded-xl text-xs font-mono text-stone-900 focus:ring-2 focus:ring-[#556B2F] focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Anon API Key</label>
                <input type="password" id="cfg_supabase_key" placeholder="eyJhbGciOiJIUzI1NiIsIn..." class="w-full p-2.5 bg-white border border-stone-300 rounded-xl text-xs font-mono text-stone-900 focus:ring-2 focus:ring-[#556B2F] focus:outline-none">
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="guardarConfiguracionSupabase()" class="px-5 py-2.5 bg-[#556B2F] hover:bg-[#3B4A20] text-white font-bold text-xs rounded-xl shadow transition-transform active:scale-95">
                    Guardar y Conectar
                </button>
                <button onclick="cerrarModalConfig()" class="px-4 py-2.5 bg-stone-200 hover:bg-stone-300 text-stone-700 font-bold text-xs rounded-xl transition-colors">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Script Supabase & Lógica de la Interfaz -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Intentar obtener credenciales guardadas en localStorage o variables globales
        let SUPABASE_URL = localStorage.getItem('OLIVETTA_SUPABASE_URL') || window.SUPABASE_URL || 'https://tu-proyecto.supabase.co';
        let SUPABASE_ANON_KEY = localStorage.getItem('OLIVETTA_SUPABASE_KEY') || window.SUPABASE_ANON_KEY || 'tu-anon-key';

        let supabase = null;
        let calendar = null;

        function initSupabaseClient() {
            const isConfigured = SUPABASE_URL && !SUPABASE_URL.includes('tu-proyecto') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('tu-anon-key');
            
            const badge = document.getElementById('statusBadge');

            if (isConfigured) {
                try {
                    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    if (badge) {
                        badge.className = 'bg-emerald-100 text-emerald-900 border border-emerald-300 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-2 shadow-sm';
                        badge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span><span>Conectado a Supabase</span>`;
                    }
                } catch (e) {
                    console.error('Error al inicializar Supabase:', e);
                    mostrarNotificacion('Error al conectar con Supabase: ' + e.message, true);
                }
            } else {
                supabase = null;
                if (badge) {
                    badge.className = 'bg-amber-100 text-amber-900 border border-amber-300 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-2 shadow-sm';
                    badge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span><span>Modo Demo Local</span>`;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initSupabaseClient();

            // Cargar datos guardados en el modal de config si existen
            document.getElementById('cfg_supabase_url').value = localStorage.getItem('OLIVETTA_SUPABASE_URL') || '';
            document.getElementById('cfg_supabase_key').value = localStorage.getItem('OLIVETTA_SUPABASE_KEY') || '';

            const calendarEl = document.getElementById('calendar');

            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'es',
                slotMinTime: '07:00:00', // 7:00 AM
                slotMaxTime: '23:00:00', // 11:00 PM
                allDaySlot: false,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                selectable: true,
                dateClick: function(info) {
                    const fechaHora = info.dateStr.split('T');
                    document.getElementById('fecha_reserva').value = fechaHora[0];
                    if (fechaHora[1]) {
                        document.getElementById('hora_reserva').value = fechaHora[1].substring(0, 5);
                    } else {
                        document.getElementById('hora_reserva').value = '12:00';
                    }
                    abrirModalNuevaReserva();
                },
                eventClick: function(info) {
                    const props = info.event.extendedProps;
                    abrirModalEditarReserva({
                        id: info.event.id,
                        nombre_cliente: props.nombre_cliente || '',
                        telefono_cliente: props.telefono_cliente || '',
                        area_evento: props.area_evento || 'restorante',
                        numero_personas: props.numero_personas || 10,
                        tipo_evento: props.tipo_evento || 'cumpleanos',
                        fecha_reserva: props.fecha_reserva || info.event.startStr.split('T')[0],
                        hora_reserva: props.hora_reserva || (info.event.startStr.split('T')[1] ? info.event.startStr.split('T')[1].substring(0,5) : '12:00')
                    });
                },
                events: async function(fetchInfo, successCallback, failureCallback) {
                    try {
                        if (!supabase) {
                            // Evento de muestra cuando Supabase no está configurado aún
                            successCallback([
                                {
                                    id: 'demo-1',
                                    title: 'CUMPLEAÑOS (TERRAZA) - Antonio Abinazar',
                                    start: `${new Date().toISOString().split('T')[0]}T14:00:00`,
                                    backgroundColor: '#556B2F',
                                    borderColor: '#3B4A20',
                                    extendedProps: {
                                        nombre_cliente: 'Antonio Abinazar',
                                        telefono_cliente: '0414-1234567',
                                        area_evento: 'terraza',
                                        numero_personas: 15,
                                        tipo_evento: 'cumpleanos',
                                        fecha_reserva: new Date().toISOString().split('T')[0],
                                        hora_reserva: '14:00'
                                    }
                                }
                            ]);
                            return;
                        }

                        const { data, error } = await supabase
                            .from('reservas')
                            .select('*')
                            .neq('estado', 'cancelada');

                        if (error) {
                            console.error('Error al consultar reservas:', error);
                            mostrarNotificacion('Error Supabase: ' + error.message, true);
                            failureCallback(error);
                            return;
                        }

                        const eventos = (data || []).map(r => ({
                            id: String(r.id),
                            title: `${(r.tipo_evento || 'Evento').toUpperCase()} (${(r.area_evento || 'restorante').toUpperCase()}) - ${r.nombre_cliente}`,
                            start: `${r.fecha_reserva}T${r.hora_reserva}`,
                            backgroundColor: '#556B2F',
                            borderColor: '#3B4A20',
                            extendedProps: {
                                nombre_cliente: r.nombre_cliente,
                                telefono_cliente: r.telefono_cliente,
                                area_evento: r.area_evento,
                                numero_personas: r.numero_personas,
                                tipo_evento: r.tipo_evento,
                                fecha_reserva: r.fecha_reserva,
                                hora_reserva: r.hora_reserva
                            }
                        }));

                        successCallback(eventos);
                    } catch (err) {
                        console.error('Excepción al consultar eventos:', err);
                        successCallback([]);
                    }
                }
            });

            calendar.render();

            document.getElementById('reservaForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const btn = document.getElementById('btnGuardarReserva');
                btn.disabled = true;
                btn.classList.add('opacity-75');

                const idReserva = document.getElementById('reserva_id').value;

                const datosReserva = {
                    nombre_cliente: document.getElementById('nombre_cliente').value.trim(),
                    telefono_cliente: document.getElementById('telefono_cliente').value.trim(),
                    area_evento: document.getElementById('area_evento').value,
                    numero_personas: parseInt(document.getElementById('numero_personas').value),
                    tipo_evento: document.getElementById('tipo_evento').value,
                    fecha_reserva: document.getElementById('fecha_reserva').value,
                    hora_reserva: document.getElementById('hora_reserva').value,
                    estado: 'pendiente'
                };

                try {
                    // Modo sin conexión o Demo
                    if (!supabase) {
                        if (idReserva) {
                            const event = calendar.getEventById(idReserva);
                            if (event) event.remove();
                        }
                        calendar.addEvent({
                            id: idReserva || String(Date.now()),
                            title: `${datosReserva.tipo_evento.toUpperCase()} (${datosReserva.area_evento.toUpperCase()}) - ${datosReserva.nombre_cliente}`,
                            start: `${datosReserva.fecha_reserva}T${datosReserva.hora_reserva}`,
                            backgroundColor: '#556B2F',
                            borderColor: '#3B4A20',
                            extendedProps: datosReserva
                        });
                        
                        mostrarNotificacion(idReserva ? '¡Evento actualizado localmente!' : '¡Evento registrado temporalmente!');
                        cerrarModal();
                        return;
                    }

                    // Operación en Supabase (INSERT o UPDATE)
                    let error = null;
                    if (idReserva) {
                        const res = await supabase.from('reservas').update(datosReserva).eq('id', idReserva);
                        error = res.error;
                    } else {
                        const res = await supabase.from('reservas').insert([datosReserva]);
                        error = res.error;
                    }

                    if (error) {
                        console.error('Error en Supabase:', error);
                        mostrarNotificacion('Error Supabase: ' + error.message, true);
                    } else {
                        mostrarNotificacion(idReserva ? '¡Evento modificado exitosamente!' : '¡Evento registrado exitosamente!');
                        cerrarModal();
                        calendar.refetchEvents();
                    }
                } catch (err) {
                    console.error('Excepción inesperada al guardar:', err);
                    mostrarNotificacion('Ocurrió un error inesperado al guardar.', true);
                } finally {
                    btn.disabled = false;
                    btn.classList.remove('opacity-75');
                }
            });
        });

        window.abrirModalNuevaReserva = function() {
            document.getElementById('reserva_id').value = '';
            document.getElementById('modalTitulo').innerText = 'Registrar Evento - Olivetta';
            document.getElementById('txtBtnGuardar').innerText = 'Confirmar Reserva';
            document.getElementById('btnEliminarReserva').classList.add('hidden');
            document.getElementById('modalReserva').classList.remove('hidden');
        };

        window.abrirModalEditarReserva = function(data) {
            document.getElementById('reserva_id').value = data.id;
            document.getElementById('nombre_cliente').value = data.nombre_cliente;
            document.getElementById('telefono_cliente').value = data.telefono_cliente;
            document.getElementById('area_evento').value = data.area_evento;
            document.getElementById('numero_personas').value = data.numero_personas;
            document.getElementById('tipo_evento').value = data.tipo_evento;
            document.getElementById('fecha_reserva').value = data.fecha_reserva;
            document.getElementById('hora_reserva').value = data.hora_reserva;

            document.getElementById('modalTitulo').innerText = 'Editar / Eliminar Evento';
            document.getElementById('txtBtnGuardar').innerText = 'Guardar Cambios';
            document.getElementById('btnEliminarReserva').classList.remove('hidden');
            document.getElementById('modalReserva').classList.remove('hidden');
        };

        window.eliminarReservaActual = async function() {
            const idReserva = document.getElementById('reserva_id').value;
            if (!idReserva) return;

            const btn = document.getElementById('btnEliminarReserva');
            btn.disabled = true;

            try {
                if (!supabase) {
                    const event = calendar.getEventById(idReserva);
                    if (event) event.remove();
                    mostrarNotificacion('Evento eliminado localmente');
                    cerrarModal();
                    return;
                }

                const { error } = await supabase.from('reservas').delete().eq('id', idReserva);

                if (error) {
                    console.error('Error al eliminar en Supabase:', error);
                    mostrarNotificacion('Error al eliminar: ' + error.message, true);
                } else {
                    mostrarNotificacion('¡Evento eliminado exitosamente!');
                    cerrarModal();
                    calendar.refetchEvents();
                }
            } catch (err) {
                console.error('Error inesperado al eliminar:', err);
                mostrarNotificacion('Error inesperado al eliminar', true);
            } finally {
                btn.disabled = false;
            }
        };

        window.cerrarModal = function() {
            document.getElementById('modalReserva').classList.add('hidden');
            document.getElementById('reservaForm').reset();
            document.getElementById('reserva_id').value = '';
        };

        function mostrarNotificacion(mensaje, esError = false) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-5 right-5 z-50 text-white font-bold px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 max-w-sm ${
                esError ? 'bg-red-700 border-2 border-white/50' : 'bg-[#556B2F] border-2 border-white/40'
            }`;
            toast.innerText = mensaje;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4500);
        }

        window.abrirModalConfig = function() {
            document.getElementById('modalConfig').classList.remove('hidden');
        };

        window.cerrarModalConfig = function() {
            document.getElementById('modalConfig').classList.add('hidden');
        };

        window.guardarConfiguracionSupabase = function() {
            const url = document.getElementById('cfg_supabase_url').value.trim();
            const key = document.getElementById('cfg_supabase_key').value.trim();

            if (!url || !key) {
                mostrarNotificacion('Por favor ingresa tanto la URL como la API Key', true);
                return;
            }

            localStorage.setItem('OLIVETTA_SUPABASE_URL', url);
            localStorage.setItem('OLIVETTA_SUPABASE_KEY', key);

            SUPABASE_URL = url;
            SUPABASE_ANON_KEY = key;

            initSupabaseClient();
            cerrarModalConfig();

            mostrarNotificacion('Configuración guardada correctamente.');
            if (calendar) {
                calendar.refetchEvents();
            }
        };
    </script>
</body>
</html>
